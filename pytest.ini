[pytest]
testpaths = tests
# The repository root on sys.path, so `custom_components` imports.
# Without it only `python -m pytest` works, because that puts the
# working directory on the path and the bare `pytest` script does not -
# which is exactly how the first CI run failed, 19 collection errors.
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
