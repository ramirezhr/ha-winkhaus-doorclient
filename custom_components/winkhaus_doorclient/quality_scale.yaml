# Home Assistant Integration Quality Scale
#
# Status of each rule for this integration. This is a custom integration, so
# nothing here is verified by Home Assistant - the file exists to keep the
# work towards Bronze honest and to record why some rules do not apply.
#
# Status values: done | todo | exempt

rules:
  # ---------------------------------------------------------------------
  # BRONZE
  # ---------------------------------------------------------------------

  config-flow: done
  # UI setup with auto-discovery and manual entry.

  entity-unique-id: done
  # Every entity derives its unique id from the serial number.

  has-entity-name: done
  # All platforms set _attr_has_entity_name = True.

  unique-config-entry: done
  # The serial number is the entry's unique id; duplicates are aborted.

  test-before-configure: done
  # config_flow verifies the connection before an entry is created.

  test-before-setup: done
  # async_config_entry_first_refresh raises ConfigEntryNotReady, which is
  # passed through since 2.4.1 so Home Assistant retries with backoff.

  appropriate-polling: done
  # Hybrid mode polls every 120s as a safety net beside the WebSocket push;
  # polling mode is user configurable between 30 and 300 seconds.

  brands: done
  # Logo and icon are published under custom_integrations in the brands repo.

  entity-event-setup: done
  # The push callback is wired up during setup and torn down in stop().

  docs-high-level-description: done
  docs-installation-instructions: done
  docs-actions: done
  docs-removal-instructions: done

  runtime-data: done
  # WinkhausRuntimeData on entry.runtime_data, with a typed ConfigEntry
  # alias used by every platform.

  common-modules: done
  # coordinator.py holds both coordinators and the runtime data,
  # entity.py the shared base for coordinator-driven entities.

  config-flow-test-coverage: done
  # 100% of config_flow.py, covering every step and every failure path.

  action-setup: done
  # All three service actions are entity services, which the rule allows
  # to be registered in the platform's async_setup_entry.

  dependency-transparency: done
  # `websockets` is the only declared requirement - aiohttp comes with Home
  # Assistant - and it meets all four points: BSD licence, published on
  # PyPI, built and published from public GitHub Actions, and every PyPI
  # version corresponds to a tag in its own repository.
  #
  # This stood as `exempt` until 3.0.0 with a comment about the protocol
  # code living in this repository rather than in a package of its own.
  # That answers a question the rule does not ask: it sets trust
  # requirements for the dependencies an integration has, not for how much
  # of its own code it has outsourced. The rule has no exceptions either,
  # so the exemption was never available in the first place.

  # ---------------------------------------------------------------------
  # SILVER
  # ---------------------------------------------------------------------

  config-entry-unloading: done
  # stop() closes the WebSocket and cancels the watchdog, followed by a
  # short cooldown so the lock can release its sockets.

  reauthentication-flow: done
  integration-owner: done
  docs-configuration-parameters: done

  docs-installation-parameters: done

  parallel-updates: done

  action-exceptions: done
  # Every entity action raises HomeAssistantError when the command did
  # not get through. The client signals that by returning False rather
  # than raising, so both outcomes are handled.

  log-when-unavailable: done
  # Warned once when contact is lost, once when it returns; everything
  # in between goes to debug.

  test-coverage: done
  # 98% overall, api.py and coordinator.py at 100%. The listener and
  # handshake tests build
  # genuine AES-CCM frames and perform a real X25519 exchange against a
  # simulated lock, so they verify the protocol rather than a mock.

  entity-unavailable: done
  # Entities go unavailable once nothing has refreshed the state for
  # STALE_STATE_AFTER (360 s), and a missing single field reads as unknown
  # rather than as a guess - the two halves the rule asks for.
  #
  # This was exempt until 3.0.0, on the grounds that for a door lock a
  # status from two minutes ago beats a greyed-out card. True for two
  # minutes, false for twenty, and the rule's own exception list covers
  # only integrations without entities and devices reachable on a second
  # channel - neither of which applies here.
  #
  # The window is deliberately longer than the watchdog's silence
  # threshold: in a quiet household the nudge's answer is the only thing
  # refreshing the state, and it arrives just after 300 s.

  # ---------------------------------------------------------------------
  # GOLD
  # ---------------------------------------------------------------------

  devices: done
  diagnostics: done
  discovery: done
  discovery-update-info: done
  # Zeroconf updates the IP of a configured lock automatically.

  entity-category: done
  entity-translations: done
  reconfiguration-flow: done
  repair-issues: done

  icon-translations: done
  # All icons live in icons.json, including the state-dependent ones for
  # the mode selector and the connection mode sensor.

  exception-translations: done

  docs-known-limitations: done
  docs-use-cases: done
  docs-supported-devices: done

  entity-device-class: done
  # The fault sensor declares the three documented codes as an enum, plus
  # a catch-all so a code added by a future firmware is reported and
  # logged rather than invalidating the sensor.

  dynamic-devices: exempt
  # One config entry represents exactly one lock, tied to the lifecycle of
  # that entry - which is the exception the rule itself names. There is
  # nothing to discover behind an entry: the serial number is part of the
  # key material, so a second lock needs a second entry.

  stale-devices: done
  # Nothing can go stale on its own here, for the same reason - there is no
  # hub a device could be removed from. What the rule asks for in that case
  # is a way for the user to clear a row by hand, and
  # async_remove_config_entry_device provides it: removal is allowed for any
  # device that is not the lock this entry is configured for, and refused
  # for that one, which would only reappear on the next reload. The case it
  # exists for is a replaced lock, whose predecessor would otherwise sit in
  # the registry forever.

  # ---------------------------------------------------------------------
  # PLATINUM
  # ---------------------------------------------------------------------

  async-dependency: done
  # aiohttp for HTTP, websockets for the push connection. Nothing runs
  # through the executor any more except building the SSL context, which
  # touches the file system and has to.

  inject-websession: done
  # The client takes a session and an SSL context from the caller;
  # async_create_client supplies Home Assistant's shared session.

  strict-typing: done
  # mypy --strict is clean across all twelve modules. Two ignores remain:
  # the websockets connection object has no stable public type, and Home
  # Assistant does not re-export ZeroconfServiceInfo.
