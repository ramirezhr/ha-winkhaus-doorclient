# Home Assistant Integration Quality Scale
#
# Status of each rule for this integration. This is a custom integration, so
# nothing here is verified by Home Assistant - the file exists to keep the
# work towards Bronze honest and to record why some rules do not apply.
#
# Status values: done | todo | exempt

rules:
  # ---------------------------------------------------------------------
  # BRONZE
  # ---------------------------------------------------------------------

  config-flow: done
  # UI setup with auto-discovery and manual entry.

  entity-unique-id: done
  # Every entity derives its unique id from the serial number.

  has-entity-name: done
  # All platforms set _attr_has_entity_name = True.

  unique-config-entry: done
  # The serial number is the entry's unique id; duplicates are aborted.

  test-before-configure: done
  # config_flow verifies the connection before an entry is created.

  test-before-setup: done
  # async_config_entry_first_refresh raises ConfigEntryNotReady, which is
  # passed through since 2.4.1 so Home Assistant retries with backoff.

  appropriate-polling: done
  # Hybrid mode polls every 120s as a safety net beside the WebSocket push;
  # polling mode is user configurable between 30 and 300 seconds.

  brands: done
  # Logo and icon are published under custom_integrations in the brands repo.

  entity-event-setup: done
  # The push callback is wired up during setup and torn down in stop().

  docs-high-level-description: done
  docs-installation-instructions: done
  docs-actions: done
  docs-removal-instructions: done

  runtime-data: done
  # WinkhausRuntimeData on entry.runtime_data, with a typed ConfigEntry
  # alias used by every platform.

  common-modules: done
  # coordinator.py holds both coordinators and the runtime data,
  # entity.py the shared base for coordinator-driven entities.

  config-flow-test-coverage: done
  # 100% of config_flow.py, covering every step and every failure path.

  action-setup: done
  # All three service actions are entity services, which the rule allows
  # to be registered in the platform's async_setup_entry.

  dependency-transparency: exempt
  # The protocol implementation lives inside this repository rather than in
  # a separate PyPI package. Splitting it out would mean maintaining two
  # repositories for a single-device integration. Both remaining
  # dependencies, aiohttp and websockets, are published and async.

  # ---------------------------------------------------------------------
  # SILVER
  # ---------------------------------------------------------------------

  config-entry-unloading: done
  # stop() closes the WebSocket and cancels the watchdog, followed by a
  # short cooldown so the lock can release its sockets.

  reauthentication-flow: done
  integration-owner: done
  docs-configuration-parameters: done

  docs-installation-parameters: done

  parallel-updates: done

  action-exceptions: done
  # Every entity action raises HomeAssistantError when the command did
  # not get through. The client signals that by returning False rather
  # than raising, so both outcomes are handled.

  log-when-unavailable: done
  # Warned once when contact is lost, once when it returns; everything
  # in between goes to debug.

  test-coverage: done
  # 97% overall, api.py at 100%. The listener and handshake tests build
  # genuine AES-CCM frames and perform a real X25519 exchange against a
  # simulated lock, so they verify the protocol rather than a mock.

  entity-unavailable: exempt
  # Deliberate deviation. The coordinator keeps the last known state
  # instead of marking entities unavailable, because for a door lock a
  # status from two minutes ago is more useful than a greyed-out card.
  # Revisit if this ever misleads anyone.

  # ---------------------------------------------------------------------
  # GOLD
  # ---------------------------------------------------------------------

  devices: done
  diagnostics: done
  discovery: done
  discovery-update-info: done
  # Zeroconf updates the IP of a configured lock automatically.

  entity-category: done
  entity-translations: done
  reconfiguration-flow: done
  repair-issues: done

  icon-translations: done
  # All icons live in icons.json, including the state-dependent ones for
  # the mode selector and the connection mode sensor.

  exception-translations: done

  docs-known-limitations: done
  docs-use-cases: done
  docs-supported-devices: done

  entity-device-class: done
  # The fault sensor declares the three documented codes as an enum, plus
  # a catch-all so a code added by a future firmware is reported and
  # logged rather than invalidating the sensor.

  dynamic-devices: exempt
  stale-devices: exempt
  # One config entry represents exactly one lock. There are no devices
  # appearing or disappearing behind a single entry.

  # ---------------------------------------------------------------------
  # PLATINUM
  # ---------------------------------------------------------------------

  async-dependency: done
  # aiohttp for HTTP, websockets for the push connection. Nothing runs
  # through the executor any more except building the SSL context, which
  # touches the file system and has to.

  inject-websession: done
  # The client takes a session and an SSL context from the caller;
  # async_create_client supplies Home Assistant's shared session.

  strict-typing: done
  # mypy --strict is clean across all twelve modules. Two ignores remain:
  # the websockets connection object has no stable public type, and Home
  # Assistant does not re-export ZeroconfServiceInfo.
